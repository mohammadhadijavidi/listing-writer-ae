name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke test CLI
        run: |
          listing-writer-ae write 04-palm-villa-rent-ar.json --provider mock
          listing-writer-ae check "Bright 1-bedroom with balcony" --lang ar
          listing-writer-ae sources > /dev/null
          python examples/quickstart.py
          python examples/check_existing_ad.py
